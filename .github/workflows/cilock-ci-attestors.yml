name: cilock-ci-attestors

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cilock-ci-attestors.yml'
      - '20-github-actions-ci/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for OIDC -> github+githubaction attestor data

jobs:
  attest-github-and-githubaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v5.0.0
      - name: install cilock from rookery v1.0.1 release
        run: |
          curl -sSL -o cilock.tar.gz https://github.com/aflock-ai/rookery/releases/download/v1.0.1/cilock-1.0.1-linux-amd64.tar.gz
          tar -xzf cilock.tar.gz
          ./cilock version | head -3
      - name: write throwaway signer key
        run: |
          openssl genrsa -out key.pem 2048
      - name: run cilock with github + githubaction attestors (real OIDC + env)
        run: |
          ./cilock run \
            --step github-actions-validation \
            --signer-file-key-path key.pem \
            --outfile attestation.json \
            --attestations environment,git,github,githubaction \
            -- echo "real GH Actions run id $GITHUB_RUN_ID"
      - name: extract + post-process attestation
        run: |
          python3 - <<'PY'
          import json, base64
          env = json.load(open('attestation.json'))
          payload = json.loads(base64.b64decode(env['payload']))
          for p in payload['predicate']['attestations']:
              t = p['type']
              if 'github' in t and 'webhook' not in t and 'action' not in t:
                  open('predicate-github.json','w').write(json.dumps(p, indent=2))
              if 'githubaction' in t:
                  open('predicate-githubaction.json','w').write(json.dumps(p, indent=2))
          print('extracted:', sorted([p['type'] for p in payload['predicate']['attestations']]))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cilock-github-attestor-validation
          path: |
            attestation.json
            predicate-github.json
            predicate-githubaction.json
          retention-days: 30
