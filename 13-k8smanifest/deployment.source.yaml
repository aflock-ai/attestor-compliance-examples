apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilock-static-demo
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cilock-static-demo
  template:
    metadata:
      labels:
        app: cilock-static-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
